name: Testing

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    - cron: "0 6 * * *"

jobs:
  test:
    uses: ./.github/workflows/setup.yml
    steps:
      - name: Run tests
        run: |
          pytest test/ -v