name: Build Container

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  push:
    branches:
      - main

env:
  IMAGE_TAG: torch-2.9.1-cu13.0

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'update-environment')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            platforms: linux/amd64
            tag-suffix: amd64
          - os: ubuntu-24.04-arm
            platforms: linux/arm64
            tag-suffix: arm64

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./environment
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vyper:${{ env.IMAGE_TAG }}-${{ matrix.tag-suffix }}
          provenance: false
          sbom: false

      - name: Delete older container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vyper'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}

  merge-manifest:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into multi-arch manifest
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=VyPER Environment Image" \
            --tag ghcr.io/${{ github.repository_owner }}/vyper:${{ env.IMAGE_TAG }} \
            ghcr.io/${{ github.repository_owner }}/vyper:${{ env.IMAGE_TAG }}-amd64 \
            ghcr.io/${{ github.repository_owner }}/vyper:${{ env.IMAGE_TAG }}-arm64

      - name: Delete arch-specific tags
        run: |
          for TAG in "${{ env.IMAGE_TAG }}-amd64" "${{ env.IMAGE_TAG }}-arm64"; do
            DIGEST=$(gh api \
              -H "Accept: application/vnd.github+json" \
              /orgs/${{ github.repository_owner }}/packages/container/vyper/versions \
              --jq ".[] | select(.metadata.container.tags[] == \"$TAG\") | .id")

            if [ -n "$DIGEST" ]; then
              gh api \
                -X DELETE \
                -H "Accept: application/vnd.github+json" \
                /orgs/${{ github.repository_owner }}/packages/container/vyper/versions/$DIGEST
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}