name: Build Container

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'update-environment')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            platforms: linux/amd64
          - os: ubuntu-24.04-arm
            platforms: linux/arm64

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./environment
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vyper:latest
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=VyPER environment image

      - name: Delete older container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'vyper'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}