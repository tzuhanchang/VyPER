name: Build Container

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-container:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'update-environment')
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./environment
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vyper:latest
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=VyPER environment image

